[project]
name = "pokemon-red-ai"
version = "0.2.0"
description = "Reinforcement learning for Pokemon Red — research toolkit and paper-grade experimental harness."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Alan Chester", email = "amcheste@gmail.com" },
]
keywords = [
    "reinforcement-learning",
    "pokemon",
    "pyboy",
    "stable-baselines3",
    "research",
    "rl-benchmark",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies as ranges.  The exact versions used for
# paper experiments are pinned in requirements.txt (frozen from the
# Python 3.13 research venv); these ranges are what a library install
# (``pip install -e .``) needs to import and run the package on any
# supported Python — without them, a standalone install of the
# package cannot even be imported.
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "pyboy>=2.0",
    "torch>=2.0",
    "stable-baselines3>=2.0",
    "sb3-contrib>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "click>=8.0",
    "rich>=13.0",
    # Alerts config loading (pokemon_red_ai.training.alerts).
    "pyyaml>=6.0",
    # Statistical analysis backend (scripts/analyze.py, comparison
    # tooling) — IQM / bootstrap CIs / probability of improvement.
    "rliable>=1.2",
]

[project.urls]
Homepage = "https://github.com/amcheste/pokemon-red-ai"
Repository = "https://github.com/amcheste/pokemon-red-ai"
Issues = "https://github.com/amcheste/pokemon-red-ai/issues"

[project.optional-dependencies]
# Install with: pip install -e ".[dashboard]"
# Only needed to run ``scripts/monitor.py`` — training itself does not
# depend on Streamlit.
dashboard = [
    "streamlit>=1.28",
]

[project.scripts]
pokemon-ai = "pokemon_red_ai.cli.commands:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Explicit package discovery: the repo root also contains non-package
# directories (configs/, save_states/, scripts/), which break
# setuptools' flat-layout auto-detection with "multiple top-level
# packages discovered".
[tool.setuptools.packages.find]
include = ["pokemon_red_ai*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::UserWarning:sdl2._internal",
]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require a real ROM or PyBoy session",
    "paper: marks tests that validate paper-relevant invariants (eval harness, seeding, reward determinism)",
]